<!doctype html>
<html dir="rtl" lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="./css/bootstrap-icons.css" />
    <!-- Style Css -->
    <link rel="stylesheet" href="./css/style.css" />
    <!-- Favicon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./images/favicon_io/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon_io/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./images/favicon_io/favicon-16x16.png"
    />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Title -->
    <title>novixweb || Css Grid Layout Project</title>
  </head>
  <body>
    <!-- Header start -->
    <header>
      <!-- Navbar  -->
      <nav id="nav" class="nav">
        <div class="nav-center">
          <div class="nav-header">
            <h3>NovixWeb</h3>
            <button id="nav-btn" class="nav-btn">
              <i class="bi bi-list-nested"></i>
            </button>
          </div>

          <ul class="nav-links">
            <li>
              <a href="">صفحه اصلی</a>
            </li>
            <li>
              <a href="">درباره من</a>
            </li>
            <li>
              <a href="">پروژه ها</a>
            </li>
            <li>
              <a href="">مقالات</a>
            </li>
          </ul>
        </div>
      </nav>

      <!-- Sidebar -->
      <aside id="sidebar" class="sidebar">
        <div>
          <button id="close-btn" class="close-btn">
            <i class="bi bi-x"></i>
          </button>

          <ul class="sidebar-links">
            <li>
              <a href="">صفحه اصلی</a>
            </li>
            <li>
              <a href="">درباره من</a>
            </li>
            <li>
              <a href="">پروژه ها</a>
            </li>
            <li>
              <a href="">مقالات</a>
            </li>
          </ul>

          <ul class="social-icons">
            <li>
              <a class="social-icon" href="">
                <i class="bi bi-facebook"></i>
              </a>
            </li>
            <li>
              <a class="social-icon" href="">
                <i class="bi bi-linkedin"></i>
              </a>
            </li>
            <li>
              <a class="social-icon" href="">
                <i class="bi bi-telegram"></i>
              </a>
            </li>
            <li>
              <a class="social-icon" href="">
                <i class="bi bi-whatsapp"></i>
              </a>
            </li>
            <li>
              <a class="social-icon" href="">
                <i class="bi bi-instagram"></i>
              </a>
            </li>
          </ul>
        </div>
      </aside>

      <!-- Hero -->
      <section class="hero">
        <div class="hero-center section-center">
          <article class="hero-info">
            <div class="underline"></div>
            <h2>لورم ایپسوم</h2>
            <h4>لورم ایپسوم متن ساختگی با تولید سادگی</h4>
            <a href="#" class="btn hero-btn">لورم ایپسوم</a>

            <ul class="social-icons hero-icons">
              <li>
                <a class="social-icon" href="">
                  <i class="bi bi-facebook"></i>
                </a>
              </li>
              <li>
                <a class="social-icon" href="">
                  <i class="bi bi-linkedin"></i>
                </a>
              </li>
              <li>
                <a class="social-icon" href="">
                  <i class="bi bi-telegram"></i>
                </a>
              </li>
              <li>
                <a class="social-icon" href="">
                  <i class="bi bi-whatsapp"></i>
                </a>
              </li>
              <li>
                <a class="social-icon" href="">
                  <i class="bi bi-instagram"></i>
                </a>
              </li>
            </ul>

          </article>

          <article class="hero-img">
            <img src="./images/hero-img.webp" alt="Image Hero">
          </article>
        </div>
      </section>
    </header>
    <!-- Header End -->

    <!-- Main Start -->
    <main></main>
    <!-- Main End -->

    <!-- JavaScript -->
    <script src="./js/app.js"></script>
  </body>
</html>
